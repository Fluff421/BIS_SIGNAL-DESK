<!DOCTYPE html>
<html lang="en" class="device-desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <title>Add {{APP_NAME}} to your Home Screen</title>
    <link rel="manifest" href="/__grok/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
  </head>
  <body>
    <div class="page">
      <main class="content content-mobile">
        <section class="copy">
          <h1>Add {{APP_NAME}} to your Home Screen</h1>
          <p>Open this page in Safari, then use Share → Add to Home Screen.</p>
          <a href="{{APP_URL}}">Open {{APP_NAME}}</a>
        </section>
      </main>
      <main class="content content-desktop">
        <section class="copy">
          <h1>Open this link on your iPhone or iPad</h1>
          <p class="desktop-note">This page shows how to add {{APP_NAME}} to an iOS Home Screen.</p>
          <a class="desktop-open" href="{{APP_URL}}">Open {{APP_NAME}}</a>
        </section>
      </main>
    </div>
  </body>
</html>
