name: Weekly Intelligence Digest

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: bis-weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Pure Node scripts — no npm ci; lockfile verification belongs in CI.
      - name: Grade any remaining results
        run: node scripts/grade-results.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true

      - name: Refit ensemble if n>=30
        run: node scripts/refit-ensemble.mjs

      - name: Generate weekly digest (incl. Grok narrative)
        run: node scripts/generate-digest.mjs
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

      - name: Commit digest
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(digest): weekly intelligence brief [skip ci]"
          add: |
            src/data/digest.json
            src/data/model.json
            src/data/ledger.json
            public/data/
          default_author: github_actions
          push: true
