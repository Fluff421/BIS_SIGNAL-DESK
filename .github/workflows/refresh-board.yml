name: Refresh Board

on:
  schedule:
    - cron: "0 11,17,23,5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: bis-refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # FPI + issued-ledger only. The expanded NFL/NCAAF library lives in
      # refresh-universe.yml — do not commit board.json here or the Odds API
      # slate will clobber 1,000+ watched games.
      - name: Refresh FPI snapshot
        run: node scripts/update-fpi.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true

      - name: Auto-grade issued sides (empty until a human issues)
        run: node scripts/grade-results.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true

      - name: Commit snapshot and issued ledger
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(data): refresh FPI snapshot and issued ledger [skip ci]"
          add: |
            src/data/snapshot.json
            src/data/ledger.json
            public/data/snapshot.json
            public/data/ledger.json
            src/data/fpi-history/
            src/data/board-history/
          default_author: github_actions
          push: true
