name: Refresh Board

on:
  schedule:
    - cron: "0 11,17,23,5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: bis-refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # These scripts are pure Node (fetch + fs). No npm install required.
      - name: Refresh FPI snapshot
        run: node scripts/update-fpi.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true

      - name: Refresh board from live odds
        run: node scripts/update-board-from-odds.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

      - name: Auto-grade completed edges (NCAAF + NFL)
        run: node scripts/grade-results.mjs
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        continue-on-error: true

      - name: Commit data
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(data): auto-refresh board, FPI, ledger [skip ci]"
          add: |
            src/data/board.json
            src/data/snapshot.json
            src/data/ledger.json
            src/data/digest.json
            public/data/board.json
            public/data/snapshot.json
            public/data/ledger.json
            src/data/fpi-history/
            src/data/board-history/
          default_author: github_actions
          push: true
